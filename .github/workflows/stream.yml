name: TCC Live Stream Server
on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: Stream Key
        required: true
        default: stream_tcc
jobs:
  stream-server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Install Nginx RTMP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx libnginx-mod-rtmp
          sudo mkdir -p /tmp/hls
          sudo chmod 777 /tmp/hls

      - name: Write Nginx config
        run: |
          python3 -c "
          cfg = open('/etc/nginx/nginx.conf').read()
          " || true
          sudo python3 -c "
          cfg = '''worker_processes auto;
          events { worker_connections 1024; }
          rtmp {
            server {
              listen 1935;
              chunk_size 4096;
              application live {
                live on;
                record off;
                hls on;
                hls_path /tmp/hls;
                hls_fragment 2s;
                hls_playlist_length 10s;
              }
            }
          }
          http {
            include mime.types;
            default_type application/octet-stream;
            server {
              listen 8080;
              location /hls {
                types {
                  application/vnd.apple.mpegurl m3u8;
                  video/mp2t ts;
                }
                root /tmp;
                add_header Cache-Control no-cache;
                add_header Access-Control-Allow-Origin *;
              }
            }
          }'''
          open('/etc/nginx/nginx.conf','w').write(cfg)
          "

      - name: Test and start Nginx
        run: |
          sudo nginx -t
          sudo nginx
          sleep 3
          echo "Nginx started successfully"

      - name: Print HLS URL
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "========================================"
          echo " RTMP : rtmp://$IP/live"
          echo " KEY  : ${{ github.event.inputs.stream_key }}"
          echo " HLS  : http://$IP:8080/hls/${{ github.event.inputs.stream_key }}.m3u8"
          echo "========================================"

      - name: Keep alive
        run: sleep 21600
