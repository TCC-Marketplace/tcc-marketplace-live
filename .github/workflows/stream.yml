name: TCC Live Stream Server
on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: Stream Key
        required: true
        default: stream_tcc

jobs:
  stream-server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ─────────────────────────────────────────────────────────────
      # STEP 1: Install dependencies
      # ─────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx libnginx-mod-rtmp ffmpeg netcat-openbsd curl
          node --version || sudo apt-get install -y nodejs
          echo "deps OK"

      # ─────────────────────────────────────────────────────────────
      # STEP 2: Write Nginx config
      #
      # Port 8080 จัดการ 2 อย่าง:
      #   /hls/    → serve HLS files (GET)
      #   /ingest  → รับ POST chunks → Node.js ingest server port 9002
      #   /health  → health check endpoint
      # ─────────────────────────────────────────────────────────────
      - name: Write Nginx config
        run: |
          printf '%s\n' \
            'load_module modules/ngx_rtmp_module.so;' \
            'worker_processes auto;' \
            'events { worker_connections 1024; }' \
            '' \
            'rtmp {' \
            '  server {' \
            '    listen 1935;' \
            '    chunk_size 4096;' \
            '    application live {' \
            '      live on;' \
            '      record off;' \
            '      hls on;' \
            '      hls_path /tmp/hls;' \
            '      hls_fragment 2s;' \
            '      hls_playlist_length 10s;' \
            '    }' \
            '  }' \
            '}' \
            '' \
            'http {' \
            '  include mime.types;' \
            '  default_type application/octet-stream;' \
            '' \
            '  server {' \
            '    listen 8080;' \
            '    client_max_body_size 0;' \
            '' \
            '    # ── HLS files (viewer GET) ─────────────────────────' \
            '    location /hls {' \
            '      types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }' \
            '      root /tmp;' \
            '      add_header Cache-Control "no-cache, no-store" always;' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '    }' \
            '' \
            '    # ── Video ingest (admin POST) ──────────────────────' \
            '    # Node.js ingest server รับ chunks → ffmpeg stdin (1 process)' \
            '    # Fix CORS double-header: Node.js upstream ส่ง Access-Control-Allow-Origin: *' \
            '    #   nginx add_header จะทำให้มี header ซ้อน "*, *" → browser บล็อก' \
            '    #   แก้ด้วย proxy_hide_header ซ่อน upstream CORS headers ก่อน nginx เพิ่มของตัวเอง' \
            '    location /ingest {' \
            '      proxy_pass              http://127.0.0.1:9002;' \
            '      proxy_http_version      1.1;' \
            '      proxy_request_buffering off;' \
            '      proxy_buffering         off;' \
            '      proxy_read_timeout      3600s;' \
            '      proxy_send_timeout      3600s;' \
            '      client_max_body_size    0;' \
            '      proxy_hide_header Access-Control-Allow-Origin;' \
            '      proxy_hide_header Access-Control-Allow-Methods;' \
            '      proxy_hide_header Access-Control-Allow-Headers;' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '      proxy_intercept_errors  on;' \
            '      error_page 502 503 504 = @ingest_error;' \
            '    }' \
            '' \
            '    # ── CORS-safe upstream error handler ───────────────' \
            '    location @ingest_error {' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      add_header Content-Type "application/json" always;' \
            '      return 502 "{\"ok\":false,\"error\":\"ingest upstream unavailable\"}";' \
            '    }' \
            '' \
            '    # ── Ingest pipeline status (admin poll) ────────────' \
            '    # Fix CORS double-header เช่นเดียวกับ /ingest' \
            '    location /ingest-status {' \
            '      proxy_pass              http://127.0.0.1:9002/status;' \
            '      proxy_http_version      1.1;' \
            '      proxy_read_timeout      5s;' \
            '      proxy_hide_header Access-Control-Allow-Origin;' \
            '      proxy_hide_header Access-Control-Allow-Methods;' \
            '      proxy_hide_header Access-Control-Allow-Headers;' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '      proxy_intercept_errors  on;' \
            '      error_page 502 503 504 = @ingest_status_error;' \
            '    }' \
            '' \
            '    location @ingest_status_error {' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Content-Type "application/json" always;' \
            '      return 503 "{\"ready\":false,\"error\":\"ingest server not ready\"}";' \
            '    }' \
            '' \
            '    # ── Health check ───────────────────────────────────' \
            '    location /health {' \
            '      add_header Access-Control-Allow-Origin "*" always;' \
            '      return 200 "OK\n";' \
            '    }' \
            '' \
            '    location / {' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '      return 200 "TCC Stream OK\n";' \
            '    }' \
            '  }' \
            '}' \
          | sudo tee /etc/nginx/nginx.conf > /dev/null

          sudo mkdir -p /tmp/hls
          sudo chmod 777 /tmp/hls
          echo "nginx.conf written"

      # ─────────────────────────────────────────────────────────────
      # STEP 3: Test and start Nginx
      # ─────────────────────────────────────────────────────────────
      - name: Test and start Nginx
        run: |
          sudo nginx -t && sudo nginx
          sleep 1
          nc -z 127.0.0.1 8080 && echo "Port 8080: READY" || echo "Port 8080: NOT READY"

      # ─────────────────────────────────────────────────────────────
      # STEP 4: Write ingest server script (base64 → avoid YAML heredoc issue)
      # ─────────────────────────────────────────────────────────────
      - name: Write Node.js ingest server
        run: |
          # เขียน ingest_server.js จาก base64 → หลีกเลี่ยง YAML heredoc syntax error
          # (heredoc flush-left content ทำให้ YAML parser error)
          echo '' | base64 -d > /tmp/ingest_server.js
          echo "ingest_server.js written ($(wc -c < /tmp/ingest_server.js) bytes)"
          node --check /tmp/ingest_server.js && echo "Node.js syntax OK" || { echo "Node.js syntax ERROR"; exit 1; }

      # ─────────────────────────────────────────────────────────────
      # STEP 5: Start ffmpeg + Node.js ingest server
      # ─────────────────────────────────────────────────────────────
      - name: Start ffmpeg and Node.js ingest server
        run: |
          STREAM_KEY="${{ github.event.inputs.stream_key }}"

          # รัน Node.js ingest server (background)
          STREAM_KEY="${STREAM_KEY}" node /tmp/ingest_server.js > /tmp/ingest.log 2>&1 &
          INGEST_PID=$!
          echo "ingest_server PID=$INGEST_PID"

          # รอ port 9002 พร้อม (max 20s)
          echo "Waiting for port 9002 (Node.js ingest server)..."
          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 9002 2>/dev/null; then
              echo "Port 9002 READY after ${i}s"
              break
            fi
            sleep 1
          done

          nc -z 127.0.0.1 9002 || {
            echo "ERROR: port 9002 not ready — ingest.log:"
            cat /tmp/ingest.log || true
            exit 1
          }
          echo "ffmpeg + ingest server pipeline ready"

      # ─────────────────────────────────────────────────────────────
      # STEP 6: Install Cloudflare Tunnel
      # ─────────────────────────────────────────────────────────────
      - name: Install Cloudflare Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/download/2024.12.2/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      # ─────────────────────────────────────────────────────────────
      # STEP 7: Start tunnel → POST URLs to Worker → notify Firebase
      # ─────────────────────────────────────────────────────────────
      - name: Start tunnel and POST URLs to Worker
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          STREAM_KEY="${{ github.event.inputs.stream_key }}"

          if [ -z "$WORKER_URL" ]; then
            echo "ERROR: WORKER_URL secret is not set!"
            exit 1
          fi

          # เปิด tunnel เดียว port 8080
          ./cloudflared tunnel --url http://localhost:8080 --no-autoupdate \
            > /tmp/cf_main.log 2>&1 &
          CF_PID=$!
          echo "cloudflared PID=$CF_PID"

          extract_url() {
            grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$1" | head -1
          }

          # Poll ทุก 2s แทน sleep 45s → URL มาเร็วแค่ไหนก็ได้ทันที (max 60s)
          echo "Waiting for tunnel URL (max 60s)..."
          CF_URL=""
          for i in $(seq 1 30); do
            CF_URL=$(extract_url /tmp/cf_main.log)
            if [ -n "$CF_URL" ]; then
              echo "Tunnel URL ready after $((i * 2))s: $CF_URL"
              break
            fi
            sleep 2
          done

          if [ -z "$CF_URL" ]; then
            echo "FATAL: ไม่พบ tunnel URL หลังรอ 60s"
            tail -30 /tmp/cf_main.log || true
            kill $CF_PID 2>/dev/null || true
            exit 1
          fi

          HLS_URL="${CF_URL}/hls/${STREAM_KEY}.m3u8"
          INGEST_URL="${CF_URL}/ingest"

          echo "HLS_URL    = $HLS_URL"
          echo "INGEST_URL = $INGEST_URL"

          # ── Service health check ────────────────────────────────
          echo "=== Service health ==="
          nc -z 127.0.0.1 8080 && echo "Port 8080 (Nginx):  OK" || echo "Port 8080: DOWN ⚠️"
          nc -z 127.0.0.1 9002 && echo "Port 9002 (ingest): OK" || echo "Port 9002: DOWN ⚠️"
          nc -z 127.0.0.1 1935 && echo "Port 1935 (RTMP):   OK" || echo "Port 1935: DOWN ⚠️"

          # ── POST URLs → Worker KV ───────────────────────────────
          HTTP_STATUS=$(curl -s -o /tmp/worker_res.txt -w "%{http_code}" \
            -X POST "${WORKER_URL}/hls-url" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: ${ADMIN_SECRET}" \
            -d "{\"hls_url\": \"${HLS_URL}\", \"ws_url\": \"${INGEST_URL}\"}")

          echo "Worker /hls-url HTTP: $HTTP_STATUS"
          cat /tmp/worker_res.txt
          echo ""

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL: Worker returned $HTTP_STATUS"
            exit 1
          fi

          echo "SUCCESS: URLs saved to Worker KV"

          # ── แจ้ง Firebase ผ่าน Worker /firebase-update ──────────
          # ทำให้ Admin/Viewer รู้ว่า server พร้อมแล้วโดยไม่ต้องรอ poll
          # Firebase update ทำผ่าน Worker (Worker ถือ Firebase secret)
          if [ -n "$WORKER_URL" ]; then
            FB_STATUS=$(curl -s -o /tmp/fb_res.txt -w "%{http_code}" \
              -X POST "${WORKER_URL}/firebase-update" \
              -H "Content-Type: application/json" \
              -H "X-Admin-Secret: ${ADMIN_SECRET}" \
              -d "{\"hls_url\": \"${HLS_URL}\", \"ingest_url\": \"${INGEST_URL}\", \"stream_key\": \"${STREAM_KEY}\"}" \
              --max-time 10) || FB_STATUS="timeout"

            echo "Worker /firebase-update HTTP: $FB_STATUS"
            cat /tmp/fb_res.txt 2>/dev/null || true
            echo ""
            # ไม่ exit ถ้า firebase-update fail — KV ยังพอใช้ได้
          fi

      # ─────────────────────────────────────────────────────────────
      # STEP 8: Keep alive with watchdog
      # ─────────────────────────────────────────────────────────────
      - name: Keep alive (max 6 hours)
        run: |
          echo "Stream is LIVE — keeping runner alive (max 6h)..."
          STREAM_KEY="${{ github.event.inputs.stream_key }}"

          for i in $(seq 1 720); do
            sleep 30

            if [ $((i % 20)) -eq 0 ]; then
              MINS=$((i / 2))
              echo "=== ${MINS} min elapsed ==="
              tail -5 /tmp/ingest.log 2>/dev/null || true

              # watchdog: restart Node.js ingest server ถ้า port 9002 down
              if ! nc -z 127.0.0.1 9002 2>/dev/null; then
                echo "⚠️ port 9002 down — restarting ingest server..."
                STREAM_KEY="${STREAM_KEY}" node /tmp/ingest_server.js >> /tmp/ingest.log 2>&1 &
                sleep 3
                nc -z 127.0.0.1 9002 \
                  && echo "✅ port 9002 recovered" \
                  || echo "❌ port 9002 still down"
              fi

              # watchdog: restart nginx ถ้า port 8080 down
              if ! nc -z 127.0.0.1 8080 2>/dev/null; then
                echo "⚠️ port 8080 down — restarting nginx..."
                sudo nginx
                sleep 2
                nc -z 127.0.0.1 8080 \
                  && echo "✅ port 8080 recovered" \
                  || echo "❌ port 8080 still down"
              fi
            fi
          done
