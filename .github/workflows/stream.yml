name: TCC Live Stream Server
on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: Stream Key
        required: true
        default: stream_tcc

jobs:
  stream-server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ─────────────────────────────────────────────────────────────
      # STEP 1: Install dependencies
      # ─────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx libnginx-mod-rtmp ffmpeg netcat-openbsd socat

      # ─────────────────────────────────────────────────────────────
      # STEP 2: Write Nginx config
      #
      # สำคัญ: เปลี่ยนจาก WebSocket → HTTP POST /ingest
      # ปัญหาเดิม: cloudflared trycloudflare ไม่รองรับ WebSocket
      #   "WebSocket is closed before the connection is established"
      # แก้: Admin ส่ง video chunks ผ่าน HTTP POST /ingest (plain HTTP)
      #   → ทำงานได้กับทุก HTTP tunnel รวมถึง cloudflared trycloudflare
      #
      # Port 8080 จัดการ 2 อย่าง:
      #   /hls/   → serve HLS files (GET)
      #   /ingest → รับ video data (POST) → named pipe → ffmpeg
      # ─────────────────────────────────────────────────────────────
      - name: Write Nginx config
        run: |
          printf '%s\n' \
            'load_module modules/ngx_rtmp_module.so;' \
            'worker_processes auto;' \
            'events { worker_connections 1024; }' \
            '' \
            'rtmp {' \
            '  server {' \
            '    listen 1935;' \
            '    chunk_size 4096;' \
            '    application live {' \
            '      live on;' \
            '      record off;' \
            '      hls on;' \
            '      hls_path /tmp/hls;' \
            '      hls_fragment 2s;' \
            '      hls_playlist_length 10s;' \
            '    }' \
            '  }' \
            '}' \
            '' \
            'http {' \
            '  include mime.types;' \
            '  default_type application/octet-stream;' \
            '' \
            '  server {' \
            '    listen 8080;' \
            '    client_max_body_size 0;' \
            '' \
            '    # ── HLS files (viewer GET) ─────────────────────────' \
            '    location /hls {' \
            '      types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }' \
            '      root /tmp;' \
            '      add_header Cache-Control "no-cache, no-store" always;' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '    }' \
            '' \
            '    # ── Video ingest (admin POST) ──────────────────────' \
            '    # Admin ส่ง Blob chunks ผ่าน HTTP POST /ingest' \
            '    # Nginx proxy_pass ไปยัง socat port 9002' \
            '    # socat pipe ไปยัง ffmpeg stdin' \
            '    location /ingest {' \
            '      proxy_pass         http://127.0.0.1:9002;' \
            '      proxy_http_version 1.1;' \
            '      proxy_request_buffering off;' \
            '      proxy_buffering    off;' \
            '      proxy_read_timeout 3600s;' \
            '      proxy_send_timeout 3600s;' \
            '      client_max_body_size 0;' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '    }' \
            '' \
            '    location / {' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '      return 200 "TCC Stream OK\n";' \
            '    }' \
            '  }' \
            '}' \
          | sudo tee /etc/nginx/nginx.conf > /dev/null

          sudo mkdir -p /tmp/hls
          sudo chmod 777 /tmp/hls
          echo "nginx.conf written"

      # ─────────────────────────────────────────────────────────────
      # STEP 3: Test and start Nginx
      # ─────────────────────────────────────────────────────────────
      - name: Test and start Nginx
        run: |
          sudo nginx -t && sudo nginx
          sleep 1
          nc -z 127.0.0.1 8080 && echo "Port 8080: READY" || echo "Port 8080: NOT READY"

      # ─────────────────────────────────────────────────────────────
      # STEP 4: Start ffmpeg ingestion pipeline
      #
      # Pipeline:
      #   Admin browser → POST /ingest (HTTP)
      #   → Nginx proxy → port 9002 (socat)
      #   → socat TCP-LISTEN:9002 → named pipe /tmp/video_pipe
      #   → ffmpeg รับจาก /tmp/video_pipe → H.264/AAC → RTMP
      #   → Nginx RTMP → HLS files /tmp/hls/stream_tcc.m3u8
      #
      # ทำไมใช้ socat + named pipe แทน websocat:
      #   - HTTP POST ไม่ต้องการ WebSocket protocol
      #   - socat รับ TCP connection → เขียนลง pipe โดยตรง
      #   - ทุก POST request = chunk ใหม่ที่ต่อเนื่องกัน
      # ─────────────────────────────────────────────────────────────
      - name: Start ffmpeg pipeline
        run: |
          STREAM_KEY="${{ github.event.inputs.stream_key }}"

          # สร้าง named pipe สำหรับส่ง data ระหว่าง socat → ffmpeg
          mkfifo /tmp/video_pipe

          # ffmpeg อ่านจาก named pipe → RTMP (background)
          ffmpeg -hide_banner -loglevel warning \
            -f webm -i /tmp/video_pipe \
            -c:v libx264 -preset ultrafast -tune zerolatency \
            -x264-params keyint=60:min-keyint=60:scenecut=0 \
            -c:a aac -ar 44100 -b:a 128k \
            -f flv "rtmp://127.0.0.1/live/${STREAM_KEY}" \
            > /tmp/ffmpeg.log 2>&1 &
          FFMPEG_PID=$!
          echo "ffmpeg PID=$FFMPEG_PID"

          # socat รับ TCP port 9002 → เขียนลง named pipe
          # fork: รับ connection ใหม่ได้เรื่อยๆ (ทุก POST request)
          socat TCP-LISTEN:9002,fork,reuseaddr - > /tmp/video_pipe &
          SOCAT_PID=$!
          echo "socat PID=$SOCAT_PID"

          # รอ port 9002 พร้อม (max 15s)
          echo "Waiting for port 9002..."
          for i in $(seq 1 15); do
            if nc -z 127.0.0.1 9002 2>/dev/null; then
              echo "Port 9002 READY after ${i}s"
              break
            fi
            sleep 1
          done

          nc -z 127.0.0.1 9002 || { echo "ERROR: port 9002 not ready"; exit 1; }
          echo "ffmpeg pipeline ready"

      # ─────────────────────────────────────────────────────────────
      # STEP 5: Install Cloudflare Tunnel
      # ─────────────────────────────────────────────────────────────
      - name: Install Cloudflare Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/download/2024.12.2/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      # ─────────────────────────────────────────────────────────────
      # STEP 6: Start tunnel and POST URLs to Worker
      #
      # URL ที่ส่งไปยัง Worker KV:
      #   hls_url: https://xxx.trycloudflare.com/hls/stream_tcc.m3u8
      #   ws_url:  https://xxx.trycloudflare.com/ingest  ← HTTP POST endpoint
      #            (ใช้ field ws_url เดิม เพื่อให้ Worker ไม่ต้องแก้)
      # ─────────────────────────────────────────────────────────────
      - name: Start tunnel and POST URLs to Worker
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          STREAM_KEY="${{ github.event.inputs.stream_key }}"

          if [ -z "$WORKER_URL" ]; then
            echo "ERROR: WORKER_URL secret is not set!"
            exit 1
          fi

          # เปิด tunnel เดียว port 8080
          ./cloudflared tunnel --url http://localhost:8080 --no-autoupdate \
            > /tmp/cf_main.log 2>&1 &
          CF_PID=$!
          echo "cloudflared PID=$CF_PID — waiting 45s..."
          sleep 45

          extract_url() {
            grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$1" | head -1
          }

          CF_URL=$(extract_url /tmp/cf_main.log)
          echo "=== cf_main.log (last 20 lines) ==="
          tail -20 /tmp/cf_main.log || true
          echo "Tunnel URL: $CF_URL"

          if [ -z "$CF_URL" ]; then
            echo "URL ยังไม่มา — รอเพิ่ม 30s..."
            sleep 30
            CF_URL=$(extract_url /tmp/cf_main.log)
            echo "Retry URL: $CF_URL"
          fi

          if [ -z "$CF_URL" ]; then
            echo "FATAL: ไม่พบ tunnel URL หลังรอ 75s"
            cat /tmp/cf_main.log || true
            kill $CF_PID 2>/dev/null || true
            exit 1
          fi

          HLS_URL="${CF_URL}/hls/${STREAM_KEY}.m3u8"
          # ส่ง HTTP ingest URL ใน field ws_url (Worker ไม่ต้องแก้)
          INGEST_URL="${CF_URL}/ingest"

          echo "HLS_URL    = $HLS_URL"
          echo "INGEST_URL = $INGEST_URL"

          # ตรวจ service health
          echo "=== Service health ==="
          nc -z 127.0.0.1 8080 && echo "Port 8080 (Nginx):  OK" || echo "Port 8080: DOWN ⚠️"
          nc -z 127.0.0.1 9002 && echo "Port 9002 (socat):  OK" || echo "Port 9002: DOWN ⚠️"
          nc -z 127.0.0.1 1935 && echo "Port 1935 (RTMP):   OK" || echo "Port 1935: DOWN ⚠️"

          # POST URLs → Worker KV
          # ส่ง ingest_url ใน field ws_url (admin.html อ่าน data.ws_url → blIngestUrl)
          HTTP_STATUS=$(curl -s -o /tmp/worker_res.txt -w "%{http_code}" \
            -X POST "${WORKER_URL}/hls-url" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: ${ADMIN_SECRET}" \
            -d "{\"hls_url\": \"${HLS_URL}\", \"ws_url\": \"${INGEST_URL}\"}")

          echo "Worker HTTP: $HTTP_STATUS"
          cat /tmp/worker_res.txt
          echo ""

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "SUCCESS: URLs saved to Worker KV"
          else
            echo "FAIL: Worker returned $HTTP_STATUS"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────
      # STEP 7: Keep alive with watchdog
      # ─────────────────────────────────────────────────────────────
      - name: Keep alive (max 6 hours)
        run: |
          echo "Stream is LIVE — keeping runner alive (max 6h)..."
          STREAM_KEY="${{ github.event.inputs.stream_key }}"

          for i in $(seq 1 720); do
            sleep 30

            if [ $((i % 20)) -eq 0 ]; then
              echo "=== $((i/2)) min elapsed ==="
              tail -5 /tmp/ffmpeg.log 2>/dev/null || true

              # watchdog: restart socat ถ้า port 9002 down
              if ! nc -z 127.0.0.1 9002 2>/dev/null; then
                echo "⚠️ port 9002 down — restarting socat..."
                socat TCP-LISTEN:9002,fork,reuseaddr - > /tmp/video_pipe &
                sleep 2
                nc -z 127.0.0.1 9002 && echo "✅ port 9002 recovered" || echo "❌ still down"
              fi

              # watchdog: restart nginx ถ้า port 8080 down
              if ! nc -z 127.0.0.1 8080 2>/dev/null; then
                echo "⚠️ port 8080 down — restarting nginx..."
                sudo nginx
                sleep 2
                nc -z 127.0.0.1 8080 && echo "✅ port 8080 recovered" || echo "❌ still down"
              fi
            fi
          done
