name: TCC Live Stream Server
on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: Stream Key
        required: true
        default: stream_tcc
jobs:
  stream-server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Install Nginx RTMP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx libnginx-mod-rtmp
          sudo mkdir -p /tmp/hls
          sudo chmod 777 /tmp/hls

      - name: Write Nginx config
        run: |
          sudo python3 -c "
          cfg = 'load_module modules/ngx_rtmp_module.so;\nworker_processes auto;\nevents { worker_connections 1024; }\nrtmp {\n  server {\n    listen 1935;\n    chunk_size 4096;\n    application live {\n      live on;\n      record off;\n      hls on;\n      hls_path /tmp/hls;\n      hls_fragment 2s;\n      hls_playlist_length 10s;\n    }\n  }\n}\nhttp {\n  include mime.types;\n  default_type application/octet-stream;\n  server {\n    listen 8080;\n    location / {\n      add_header Access-Control-Allow-Origin \"*\" always;\n      add_header Access-Control-Allow-Methods \"GET, OPTIONS\" always;\n      add_header Access-Control-Allow-Headers \"*\" always;\n      if (\$request_method = OPTIONS) { return 204; }\n    }\n    location /hls {\n      types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }\n      root /tmp;\n      add_header Cache-Control no-cache always;\n      add_header Access-Control-Allow-Origin \"*\" always;\n      add_header Access-Control-Allow-Methods \"GET, OPTIONS\" always;\n      add_header Access-Control-Allow-Headers \"*\" always;\n    }\n  }\n}'
          open('/etc/nginx/nginx.conf','w').write(cfg)
          "

      - name: Start Nginx
        run: sudo nginx

      - name: Install Cloudflare Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start Tunnel and print URLs
        run: |
          ./cloudflared tunnel --url http://localhost:8080 --no-autoupdate > /tmp/cf.log 2>&1 &
          sleep 10
          CF_URL=$(grep -o 'https://[a-z0-9\-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
          PUBLIC_IP=$(curl -s https://api.ipify.org)
          echo "========================================"
          echo " OBS RTMP  : rtmp://$PUBLIC_IP/live"
          echo " Stream Key: ${{ github.event.inputs.stream_key }}"
          echo " HLS URL   : $CF_URL/hls/${{ github.event.inputs.stream_key }}.m3u8"
          echo "========================================"
          echo "1. ใส่ RTMP URL ใน OBS แล้ว Start Streaming"
          echo "2. ใส่ HLS URL ใน TCC Admin แล้วกด บันทึก"
          echo "3. กด เริ่ม Live"

      - name: Keep alive
        run: sleep 21600
