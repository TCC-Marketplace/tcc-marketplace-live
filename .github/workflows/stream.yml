name: TCC Live Stream Server
on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: Stream Key
        required: true
        default: stream_tcc

jobs:
  stream-server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ─────────────────────────────────────────────────────────────
      # STEP 1: Install dependencies
      # ─────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx libnginx-mod-rtmp ffmpeg netcat-openbsd curl
          node --version || sudo apt-get install -y nodejs
          echo "deps OK"

      # ─────────────────────────────────────────────────────────────
      # STEP 2: Write Nginx config
      #
      # Port 8080 จัดการ 2 อย่าง:
      #   /hls/    → serve HLS files (GET)
      #   /ingest  → รับ POST chunks → Node.js ingest server port 9002
      #   /health  → health check endpoint
      # ─────────────────────────────────────────────────────────────
      - name: Write Nginx config
        run: |
          printf '%s\n' \
            'load_module modules/ngx_rtmp_module.so;' \
            'worker_processes auto;' \
            'events { worker_connections 1024; }' \
            '' \
            'rtmp {' \
            '  server {' \
            '    listen 1935;' \
            '    chunk_size 4096;' \
            '    application live {' \
            '      live on;' \
            '      record off;' \
            '      hls on;' \
            '      hls_path /tmp/hls;' \
            '      hls_fragment 2s;' \
            '      hls_playlist_length 10s;' \
            '    }' \
            '  }' \
            '}' \
            '' \
            'http {' \
            '  include mime.types;' \
            '  default_type application/octet-stream;' \
            '' \
            '  server {' \
            '    listen 8080;' \
            '    client_max_body_size 0;' \
            '' \
            '    # ── HLS files (viewer GET) ─────────────────────────' \
            '    location /hls {' \
            '      types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }' \
            '      root /tmp;' \
            '      add_header Cache-Control "no-cache, no-store" always;' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '    }' \
            '' \
            '    # ── Video ingest (admin POST) ──────────────────────' \
            '    # Node.js ingest server รับ chunks → ffmpeg stdin (1 process)' \
            '    # Fix: proxy_intercept_errors + named location @cors_502' \
            '    #      เพื่อ inject CORS headers แม้ตอน upstream 502' \
            '    #      (add_header ใน proxy location ไม่ inject ตอน error response)' \
            '    location /ingest {' \
            '      proxy_pass              http://127.0.0.1:9002;' \
            '      proxy_http_version      1.1;' \
            '      proxy_request_buffering off;' \
            '      proxy_buffering         off;' \
            '      proxy_read_timeout      3600s;' \
            '      proxy_send_timeout      3600s;' \
            '      client_max_body_size    0;' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '      # Fix CORS on upstream error: intercept 502/503/504 → named location' \
            '      proxy_intercept_errors  on;' \
            '      error_page 502 503 504 = @ingest_error;' \
            '    }' \
            '' \
            '    # ── CORS-safe upstream error handler ───────────────' \
            '    location @ingest_error {' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      add_header Content-Type "application/json" always;' \
            '      return 502 "{\"ok\":false,\"error\":\"ingest upstream unavailable\"}";' \
            '    }' \
            '' \
            '    # ── Ingest pipeline status (admin poll) ────────────' \
            '    location /ingest-status {' \
            '      proxy_pass              http://127.0.0.1:9002/status;' \
            '      proxy_http_version      1.1;' \
            '      proxy_read_timeout      5s;' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '      proxy_intercept_errors  on;' \
            '      error_page 502 503 504 = @ingest_status_error;' \
            '    }' \
            '' \
            '    location @ingest_status_error {' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Content-Type "application/json" always;' \
            '      return 503 "{\"ready\":false,\"error\":\"ingest server not ready\"}";' \
            '    }' \
            '' \
            '    # ── Health check ───────────────────────────────────' \
            '    location /health {' \
            '      add_header Access-Control-Allow-Origin "*" always;' \
            '      return 200 "OK\n";' \
            '    }' \
            '' \
            '    location / {' \
            '      add_header Access-Control-Allow-Origin  "*" always;' \
            '      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;' \
            '      add_header Access-Control-Allow-Headers "*" always;' \
            '      if ($request_method = OPTIONS) { return 204; }' \
            '      return 200 "TCC Stream OK\n";' \
            '    }' \
            '  }' \
            '}' \
          | sudo tee /etc/nginx/nginx.conf > /dev/null

          sudo mkdir -p /tmp/hls
          sudo chmod 777 /tmp/hls
          echo "nginx.conf written"

      # ─────────────────────────────────────────────────────────────
      # STEP 3: Test and start Nginx
      # ─────────────────────────────────────────────────────────────
      - name: Test and start Nginx
        run: |
          sudo nginx -t && sudo nginx
          sleep 1
          nc -z 127.0.0.1 8080 && echo "Port 8080: READY" || echo "Port 8080: NOT READY"

      # ─────────────────────────────────────────────────────────────
      # STEP 4: Start ffmpeg + Node.js ingest server
      #
      # แก้ปัญหา Critical #1: socat + named pipe ทำให้ ffmpeg ได้ stream ขาดๆ
      # เพราะแต่ละ POST = TCP connection ใหม่ → socat fork เขียน pipe ซ้อนกัน
      #
      # วิธีใหม่: Node.js HTTP ingest server (1 process ตลอด)
      #   - รับ POST /ingest → drain request body ต่อเนื่องไปยัง ffmpeg stdin
      #   - ffmpeg stdin = 1 process, 1 stream → ไม่ขาด
      #   - แต่ละ POST chunk ถูก pipe เข้า ffmpeg.stdin โดยตรง (no fork, no race)
      #
      # Pipeline ใหม่:
      #   Browser POST chunks → Nginx → Node.js :9002
      #   → ffmpeg.stdin (process pipe, 1 connection) → RTMP → HLS
      # ─────────────────────────────────────────────────────────────
      - name: Start ffmpeg and Node.js ingest server
        run: |
          STREAM_KEY="${{ github.event.inputs.stream_key }}"

          # ── เขียน Node.js ingest server ──────────────────────────
          cat > /tmp/ingest_server.js << 'NODE_EOF'
const http = require('http');
const { spawn } = require('child_process');

const STREAM_KEY = process.env.STREAM_KEY || 'stream_tcc';
const PORT = 9002;

// ── เริ่ม ffmpeg process ─────────────────────────────────
// stdin = readable stream จาก ingest server (continuous)
// ไม่ใช้ named pipe → ไม่มี race condition จาก multi-POST
const ffmpeg = spawn('ffmpeg', [
  '-hide_banner', '-loglevel', 'warning',
  '-f', 'webm',
  '-i', 'pipe:0',                    // stdin ← Node.js pipe
  '-c:v', 'libx264',
  '-preset', 'ultrafast',
  '-tune', 'zerolatency',
  '-x264-params', 'keyint=60:min-keyint=60:scenecut=0',
  '-c:a', 'aac',
  '-ar', '44100',
  '-b:a', '128k',
  '-f', 'flv',
  `rtmp://127.0.0.1/live/${STREAM_KEY}`
], {
  stdio: ['pipe', 'pipe', 'pipe']
});

ffmpeg.stdout.on('data', d => process.stdout.write('[ffmpeg] ' + d));
ffmpeg.stderr.on('data', d => process.stderr.write('[ffmpeg] ' + d));
ffmpeg.on('close', code => {
  console.log(`[ffmpeg] exited code=${code}`);
  // ffmpeg ตาย → ออก process ให้ watchdog restart
  process.exit(1);
});

ffmpeg.on('error', err => {
  console.error('[ffmpeg] spawn error:', err.message);
  process.exit(1);
});

// ── Chunk queue + serial writer ──────────────────────────
// แก้ปัญหา: หลาย POST มาพร้อมกัน → เขียน stdin พร้อมกัน backpressure crash
// วิธีแก้: queue chunks, drain หนึ่ง chunk ต่อครั้ง
let writing = false;
const queue = [];

function drainQueue() {
  if (writing || queue.length === 0) return;
  writing = true;
  const chunk = queue.shift();
  const ok = ffmpeg.stdin.write(chunk, () => {
    writing = false;
    drainQueue();
  });
  // ถ้า backpressure → รอ drain event
  if (!ok) {
    ffmpeg.stdin.once('drain', () => {
      writing = false;
      drainQueue();
    });
  }
}

// ── Stats counters ───────────────────────────────────────
let chunksReceived = 0;
let bytesReceived  = 0;
const startedAt    = Date.now();

// ── HTTP ingest server ───────────────────────────────────
const server = http.createServer((req, res) => {
  // CORS headers — ทุก request รวมถึง error response
  res.setHeader('Access-Control-Allow-Origin',  '*');
  res.setHeader('Access-Control-Allow-Methods', 'POST, GET, OPTIONS');
  res.setHeader('Access-Control-Allow-Headers', '*');

  if (req.method === 'OPTIONS') {
    res.writeHead(204); res.end(); return;
  }

  // ── GET /status — ingest pipeline health check ─────────
  // ใช้โดย Nginx /ingest-status → admin.html poll ก่อนส่ง chunk
  if (req.method === 'GET' && req.url === '/status') {
    const uptime = Math.floor((Date.now() - startedAt) / 1000);
    const ffmpegAlive = ffmpeg && !ffmpeg.killed && ffmpeg.exitCode === null;
    res.writeHead(ffmpegAlive ? 200 : 503, { 'Content-Type': 'application/json' });
    res.end(JSON.stringify({
      ready:          ffmpegAlive,
      ffmpeg_pid:     ffmpeg ? ffmpeg.pid : null,
      ffmpeg_alive:   ffmpegAlive,
      queue_length:   queue.length,
      chunks_received: chunksReceived,
      bytes_received:  bytesReceived,
      uptime_seconds:  uptime,
    }));
    return;
  }

  if (req.method !== 'POST') {
    res.writeHead(405); res.end('Method Not Allowed'); return;
  }

  // ── POST /ingest — รับ chunk → queue → ffmpeg stdin ────
  const chunks = [];
  req.on('data', d => chunks.push(d));
  req.on('end', () => {
    const body = Buffer.concat(chunks);
    if (body.length > 0) {
      chunksReceived++;
      bytesReceived += body.length;
      queue.push(body);
      drainQueue();
    }
    // ตอบ 200 ทันทีหลัง enqueue (ไม่รอ ffmpeg write)
    res.writeHead(200); res.end('ok');
  });
  req.on('error', err => {
    console.error('[ingest] req error:', err.message);
    res.writeHead(500); res.end();
  });
});

server.listen(PORT, '127.0.0.1', () => {
  console.log(`[ingest] server listening on port ${PORT}`);
  console.log(`[ingest] ffmpeg PID=${ffmpeg.pid}`);
});

server.on('error', err => {
  console.error('[ingest] server error:', err.message);
  process.exit(1);
});

// graceful shutdown
process.on('SIGTERM', () => {
  console.log('[ingest] SIGTERM → closing');
  ffmpeg.stdin.end();
  server.close();
});
NODE_EOF

          # รัน Node.js ingest server (background)
          STREAM_KEY="${STREAM_KEY}" node /tmp/ingest_server.js > /tmp/ingest.log 2>&1 &
          INGEST_PID=$!
          echo "ingest_server PID=$INGEST_PID"

          # รอ port 9002 พร้อม (max 20s)
          echo "Waiting for port 9002 (Node.js ingest server)..."
          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 9002 2>/dev/null; then
              echo "Port 9002 READY after ${i}s"
              break
            fi
            sleep 1
          done

          nc -z 127.0.0.1 9002 || {
            echo "ERROR: port 9002 not ready — ingest.log:"
            cat /tmp/ingest.log || true
            exit 1
          }
          echo "ffmpeg + ingest server pipeline ready"

      # ─────────────────────────────────────────────────────────────
      # STEP 5: Install Cloudflare Tunnel
      # ─────────────────────────────────────────────────────────────
      - name: Install Cloudflare Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/download/2024.12.2/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      # ─────────────────────────────────────────────────────────────
      # STEP 6: Start tunnel → POST URLs to Worker → notify Firebase
      # ─────────────────────────────────────────────────────────────
      - name: Start tunnel and POST URLs to Worker
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          STREAM_KEY="${{ github.event.inputs.stream_key }}"

          if [ -z "$WORKER_URL" ]; then
            echo "ERROR: WORKER_URL secret is not set!"
            exit 1
          fi

          # เปิด tunnel เดียว port 8080
          ./cloudflared tunnel --url http://localhost:8080 --no-autoupdate \
            > /tmp/cf_main.log 2>&1 &
          CF_PID=$!
          echo "cloudflared PID=$CF_PID — waiting 45s..."
          sleep 45

          extract_url() {
            grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$1" | head -1
          }

          CF_URL=$(extract_url /tmp/cf_main.log)
          echo "=== cf_main.log (last 20 lines) ==="
          tail -20 /tmp/cf_main.log || true
          echo "Tunnel URL: $CF_URL"

          if [ -z "$CF_URL" ]; then
            echo "URL ยังไม่มา — รอเพิ่ม 30s..."
            sleep 30
            CF_URL=$(extract_url /tmp/cf_main.log)
            echo "Retry URL: $CF_URL"
          fi

          if [ -z "$CF_URL" ]; then
            echo "FATAL: ไม่พบ tunnel URL หลังรอ 75s"
            cat /tmp/cf_main.log || true
            kill $CF_PID 2>/dev/null || true
            exit 1
          fi

          HLS_URL="${CF_URL}/hls/${STREAM_KEY}.m3u8"
          INGEST_URL="${CF_URL}/ingest"

          echo "HLS_URL    = $HLS_URL"
          echo "INGEST_URL = $INGEST_URL"

          # ── Service health check ────────────────────────────────
          echo "=== Service health ==="
          nc -z 127.0.0.1 8080 && echo "Port 8080 (Nginx):  OK" || echo "Port 8080: DOWN ⚠️"
          nc -z 127.0.0.1 9002 && echo "Port 9002 (ingest): OK" || echo "Port 9002: DOWN ⚠️"
          nc -z 127.0.0.1 1935 && echo "Port 1935 (RTMP):   OK" || echo "Port 1935: DOWN ⚠️"

          # ── POST URLs → Worker KV ───────────────────────────────
          HTTP_STATUS=$(curl -s -o /tmp/worker_res.txt -w "%{http_code}" \
            -X POST "${WORKER_URL}/hls-url" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: ${ADMIN_SECRET}" \
            -d "{\"hls_url\": \"${HLS_URL}\", \"ws_url\": \"${INGEST_URL}\"}")

          echo "Worker /hls-url HTTP: $HTTP_STATUS"
          cat /tmp/worker_res.txt
          echo ""

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL: Worker returned $HTTP_STATUS"
            exit 1
          fi

          echo "SUCCESS: URLs saved to Worker KV"

          # ── แจ้ง Firebase ผ่าน Worker /firebase-update ──────────
          # ทำให้ Admin/Viewer รู้ว่า server พร้อมแล้วโดยไม่ต้องรอ poll
          # Firebase update ทำผ่าน Worker (Worker ถือ Firebase secret)
          if [ -n "$WORKER_URL" ]; then
            FB_STATUS=$(curl -s -o /tmp/fb_res.txt -w "%{http_code}" \
              -X POST "${WORKER_URL}/firebase-update" \
              -H "Content-Type: application/json" \
              -H "X-Admin-Secret: ${ADMIN_SECRET}" \
              -d "{\"hls_url\": \"${HLS_URL}\", \"ingest_url\": \"${INGEST_URL}\", \"stream_key\": \"${STREAM_KEY}\"}" \
              --max-time 10) || FB_STATUS="timeout"

            echo "Worker /firebase-update HTTP: $FB_STATUS"
            cat /tmp/fb_res.txt 2>/dev/null || true
            echo ""
            # ไม่ exit ถ้า firebase-update fail — KV ยังพอใช้ได้
          fi

      # ─────────────────────────────────────────────────────────────
      # STEP 7: Keep alive with watchdog
      # ─────────────────────────────────────────────────────────────
      - name: Keep alive (max 6 hours)
        run: |
          echo "Stream is LIVE — keeping runner alive (max 6h)..."
          STREAM_KEY="${{ github.event.inputs.stream_key }}"

          for i in $(seq 1 720); do
            sleep 30

            if [ $((i % 20)) -eq 0 ]; then
              MINS=$((i / 2))
              echo "=== ${MINS} min elapsed ==="
              tail -5 /tmp/ingest.log 2>/dev/null || true

              # watchdog: restart Node.js ingest server ถ้า port 9002 down
              if ! nc -z 127.0.0.1 9002 2>/dev/null; then
                echo "⚠️ port 9002 down — restarting ingest server..."
                STREAM_KEY="${STREAM_KEY}" node /tmp/ingest_server.js >> /tmp/ingest.log 2>&1 &
                sleep 3
                nc -z 127.0.0.1 9002 \
                  && echo "✅ port 9002 recovered" \
                  || echo "❌ port 9002 still down"
              fi

              # watchdog: restart nginx ถ้า port 8080 down
              if ! nc -z 127.0.0.1 8080 2>/dev/null; then
                echo "⚠️ port 8080 down — restarting nginx..."
                sudo nginx
                sleep 2
                nc -z 127.0.0.1 8080 \
                  && echo "✅ port 8080 recovered" \
                  || echo "❌ port 8080 still down"
              fi
            fi
          done
