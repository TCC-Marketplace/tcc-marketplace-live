name: TCC Live Stream Server
on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: Stream Key
        required: true
        default: stream_tcc
jobs:
  stream-server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Install Nginx RTMP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx libnginx-mod-rtmp
          sudo mkdir -p /tmp/hls
          sudo chmod 777 /tmp/hls
      - name: Write Nginx config
        run: |
          sudo python3 -c "
          cfg = 'load_module modules/ngx_rtmp_module.so;\nworker_processes auto;\nevents { worker_connections 1024; }\nrtmp {\n  server {\n    listen 1935;\n    chunk_size 4096;\n    application live {\n      live on;\n      record off;\n      hls on;\n      hls_path /tmp/hls;\n      hls_fragment 2s;\n      hls_playlist_length 10s;\n    }\n  }\n}\nhttp {\n  include mime.types;\n  default_type application/octet-stream;\n  server {\n    listen 8080;\n    location /hls {\n      types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }\n      root /tmp;\n      add_header Cache-Control no-cache;\n      add_header Access-Control-Allow-Origin *;\n    }\n  }\n}'
          open('/etc/nginx/nginx.conf','w').write(cfg)
          "
      - name: Test and start Nginx
        run: |
          sudo nginx -t
          sudo nginx
      - name: Print HLS URL
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "========================================"
          echo " RTMP : rtmp://$IP/live"
          echo " KEY  : ${{ github.event.inputs.stream_key }}"
          echo " HLS  : http://$IP:8080/hls/${{ github.event.inputs.stream_key }}.m3u8"
          echo "========================================"
      - name: Keep alive
        run: sleep 21600
